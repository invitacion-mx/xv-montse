<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR — XV Montse</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fdf6f0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Cormorant Garamond',serif;padding:20px}
  .card{background:white;border:2px solid #f0c4d0;border-radius:24px;padding:40px 36px;text-align:center;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(201,116,143,.12)}
  .top-label{font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:#c9a96e;margin-bottom:8px}
  .nombre{font-family:'Great Vibes',cursive;font-size:3.5rem;color:#8e3f56;line-height:1;margin-bottom:4px}
  .fecha{font-family:'Playfair Display',serif;font-size:1rem;color:#6b4a58;letter-spacing:.12em;margin-bottom:20px}
  .divider{display:flex;align-items:center;gap:10px;margin:16px 0}
  .divider .line{flex:1;height:1px;background:linear-gradient(to right,transparent,#f0c4d0,transparent)}
  .instruccion{font-size:1.05rem;font-style:italic;color:#6b4a58;line-height:1.7;margin-bottom:20px}
  #qrcode{display:flex;justify-content:center;margin:4px 0 20px}
  #qrcode img,#qrcode canvas{border-radius:12px;border:3px solid #f0c4d0 !important}
  .url-text{font-size:.78rem;color:#c9a8b4;letter-spacing:.06em;margin-bottom:20px;word-break:break-all}
  .bottom{border-top:1px solid #f0c4d0;padding-top:18px;font-size:.82rem;color:#9a7d8a;font-style:italic;line-height:1.7}
  .print-btn{margin-top:20px;padding:10px 28px;background:#8e3f56;color:white;border:none;border-radius:30px;font-family:'Cormorant Garamond',serif;font-size:1rem;cursor:pointer;letter-spacing:.08em}
  .print-btn:hover{background:#c9748f}
  @media print{.print-btn{display:none}body{background:white}}
</style>
</head>
<body>
<div class="card">
  <p class="top-label">✦ Celebración XV Años ✦</p>
  <h1 class="nombre">Montse</h1>
  <p class="fecha">23 · 05 · 2026</p>

  <div class="divider"><span class="line"></span><span style="font-size:1.1rem">🌸</span><span class="line"></span></div>

  <p class="instruccion">¡Escanea el código QR,<br>Captura tu mejor momento<br> y Compartela a mi álbum del evento!</p>

  <div id="qrcode"></div>
  <p class="url-text" id="url-display"></p>

  <div class="bottom">
    📷 Tu foto quedará en mi álbum
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ Imprimir QR</button>
</div>

<script>
  // ⬇️ Cambia esta URL por la de tu página subir-foto en Netlify
  const URL_SUBIR = "https://invitacion-mx.github.io/xv-montse/subir-foto.html";

  document.getElementById('url-display').textContent = URL_SUBIR;

  new QRCode(document.getElementById('qrcode'), {
    text: URL_SUBIR,
    width: 220,
    height: 220,
    colorDark: "#8e3f56",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
